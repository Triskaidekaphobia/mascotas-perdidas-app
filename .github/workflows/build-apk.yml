
name: Generar APK Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android
        uses: android-actions/setup-android@v3

      - name: Instalar SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer aplicación
        run: |
          unzip -q MascotasPerdidasAndroid-compilar-APK.zip -d /tmp/mascotas
          test -f /tmp/mascotas/MascotasPerdidasAndroid/settings.gradle

      - name: Compilar APK
        run: |
          gradle -p /tmp/mascotas/MascotasPerdidasAndroid --no-daemon assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: MascotasPerdidas-APK
          path: /tmp/mascotas/MascotasPerdidasAndroid/app/build/outputs/apk/debug/app-debug.apk
